name: Refresh source briefs

on:
  schedule:
    - cron: '17 6,10 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-edition
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Collect recent source briefs
        run: python3 scripts/refresh_news.py
      - name: Publish changed edition
        run: |
          if git diff --quiet -- news-feed.json; then exit 0; fi
          git config user.name "ailleurs-news-bot"
          git config user.email "ailleurs-news-bot@users.noreply.github.com"
          git add news-feed.json
          git commit -m "Refresh source briefs for Shanghai day"
          git push
