<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="src/music-refinements.css"><style>body{background:#202125;color:#eee;font:15px system-ui;max-width:850px;margin:20px auto;padding:10px}button{padding:12px}#log{white-space:pre-wrap}#stage{min-height:460px}</style></head><body><h1>YouTube embed verification</h1><button id="start">Check all videos</button><div id="stage"></div><output id="log"></output><script src="src/music-videos.js"></script><script src="src/music-video-player.js"></script><script>const stage=document.querySelector('#stage'),log=document.querySelector('#log');let running=false;document.querySelector('#start').onclick=async()=>{if(running)return;running=true;const rows=[{"album": "1097862870", "artist": "Radiohead", "name": "Everything In Its Right Place", "id": "d9zk2j3JPK4", "videoTitle": "Everything In Its Right Place", "channel": "Radiohead - Topic", "channelUrl": "https://www.youtube.com/channel/UCr_iyUANcn9OX_yy9piYoLw"}, {"album": "1443287350", "artist": "Faye Wong", "name": "無常", "id": "2FUiZYrPZWk", "videoTitle": "無常", "channel": "Faye Wong - Topic", "channelUrl": "https://www.youtube.com/channel/UCnAmvOfJxmcMd5q48BEIuPQ"}, {"album": "", "artist": "Beyond", "name": "光輝歲月", "id": "PrGsAMbgUh4", "videoTitle": "Beyond - 光輝歲月 (Official Music Video)", "channel": "BeyondVEVO", "channelUrl": "https://www.youtube.com/@BeyondVEVO"}, {"album": "1416925635", "artist": "Fishmans", "name": "Long Season (Live At Akasaka Blitz / 1998)", "id": "4Tz4xEyx0R0", "videoTitle": "Long Season (Live At Akasaka Blitz / 1998)", "channel": "Fishmans - Topic", "channelUrl": "https://www.youtube.com/channel/UC7xvvw65sBv6VkZwua70lgA"}, {"album": "1440788438", "artist": "Stevie Wonder", "name": "I Wish", "id": "c7IYSAUj78g", "videoTitle": "I Wish", "channel": "Stevie Wonder - Topic", "channelUrl": "https://www.youtube.com/channel/UCR83RRXHzXrEQbu_ZQmPMSg"}, {"album": "1440864756", "artist": "Chet Baker", "name": "My Funny Valentine (2004 remaster)", "id": "pmCBZW5fBB4", "channel": "Chet Baker - Topic"}, {"album": "1440864756", "artist": "Chet Baker", "name": "I Fall In Love Too Easily", "id": "_ZRJrAHprBM", "channel": "Chet Baker - Topic"}];let out=[];for(const row of rows){log.textContent=out.join('\n')+'\nTesting '+row.name+' / '+row.artist;const result=await new Promise(resolve=>{let done=false;const finish=text=>{if(done)return;done=true;clearTimeout(timer);stage.removeEventListener('ailleurs:video-state',state);stage.removeEventListener('ailleurs:video-error',error);resolve(text);};const state=e=>{if(e.detail.id===row.id&&e.detail.state===1)finish('PLAYING');},error=e=>{if(e.detail.id===row.id)finish('ERROR '+e.detail.code);};stage.addEventListener('ailleurs:video-state',state);stage.addEventListener('ailleurs:video-error',error);const timer=setTimeout(()=>finish('TIMEOUT'),12000);AilleursVideoPlayer.mount(stage,[row],{autoplay:true,muted:true});});out.push(row.id+' | '+row.artist+' / '+row.name+' | '+result);await new Promise(r=>setTimeout(r,700));}AilleursVideoPlayer.destroy(stage);stage.replaceChildren();log.textContent=out.join('\n')+'\nDONE';running=false;};</script></body></html>
