<!doctype html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="src/music-refinements.css"><style>body{background:#202125;color:#eee;font:15px system-ui;max-width:850px;margin:20px auto;padding:10px}button{padding:12px}#log{white-space:pre-wrap}#stage{min-height:460px}</style></head><body><h1>YouTube embed verification</h1><button id="start">Check all videos</button><div id="stage"></div><output id="log"></output><script src="src/music-videos.js"></script><script src="src/music-video-player.js"></script><script>const stage=document.querySelector('#stage'),log=document.querySelector('#log');let running=false;document.querySelector('#start').onclick=async()=>{if(running)return;running=true;const rows=AilleursMusicVideos.items;let out=[];for(const row of rows){log.textContent=out.join('\n')+'\nTesting '+row.name+' / '+row.artist;const result=await new Promise(resolve=>{let done=false;const finish=text=>{if(done)return;done=true;clearTimeout(timer);stage.removeEventListener('ailleurs:video-state',state);stage.removeEventListener('ailleurs:video-error',error);resolve(text);};const state=e=>{if(e.detail.id===row.id&&e.detail.state===1)finish('PLAYING');},error=e=>{if(e.detail.id===row.id)finish('ERROR '+e.detail.code);};stage.addEventListener('ailleurs:video-state',state);stage.addEventListener('ailleurs:video-error',error);const timer=setTimeout(()=>finish('TIMEOUT'),12000);AilleursVideoPlayer.mount(stage,[row],{autoplay:true,muted:true});});out.push(row.id+' | '+row.artist+' / '+row.name+' | '+result);await new Promise(r=>setTimeout(r,700));}AilleursVideoPlayer.destroy(stage);stage.replaceChildren();log.textContent=out.join('\n')+'\nDONE';running=false;};</script></body></html>
